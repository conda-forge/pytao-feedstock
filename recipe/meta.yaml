{% set name = "pytao" %}
{% set version = "1.2.3" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.tar.gz
  sha256: 217c54dcc177d81e4f88a8cfa45517a4d0f64dc4d695509195f8320d5e34c183

build:
  noarch: python
  number: 0
  script: {{ PYTHON }} -m pip install . -vv --no-deps

requirements:
  host:
    - python {{ python_min }}
    - pip
    - setuptools_scm
    - setuptools
  run:
    - python >={{ python_min }}
    - bmad >=20260317
    - h5py
    - matplotlib-base
    - numpy
    - openpmd-beamphysics >=0.14.1
    - orjson
    - ormsgpack
    - pexpect
    - pydantic >=2.12.5
    - pyyaml
    - rich
    - tqdm

test:
  requires:
    - python {{ python_min }}
    - git
    - pytest
    - pytest-cov
    - bokeh
    - ipython
    - openpmd-beamphysics
  imports:
    - pytao
    - pytao.plotting
    - pytao.plotting.bokeh
  commands:
    - pytao --help
    - git clone --depth 1 https://github.com/bmad-sim/bmad-ecosystem bmad
    - echo | pytao -noplot -lat $PWD/bmad/bmad-doc/tao_examples/erl/lat.bmad
    # Notes:
    # 'help' - I forget why it's there
    # 'test_plot' I think because it's slow
    # 'constraints' because it can't load the lattices in the long $PREFIX path (Tao init length bug)
    # 'test_ele' due to tao.init loading issue on gfortran 16.x; should be removed
    - TAO_REUSE_SUBPROCESS=1 ACC_ROOT_DIR=$PWD/bmad pytest -v --pyargs pytao.tests -k "not help and not test_plot and not constraints and not test_ele"

about:
  home: https://github.com/bmad-sim/pytao
  license: GPL-3.0-only
  license_family: GPL
  license_file: LICENSE
  summary: PyTao is wrapper on top of Tao and allow users to access the Tao library via ctypes or pexpect.
  description: |
    PyTao is wrapper on top of Tao and allow users to access the Tao library via ctypes or pexpect.
    Tao is an open source general purpose program for charged particle and X-ray simulations in 
    accelerators and storage rings.
  doc_url: https://bmad-sim.github.io/pytao
  dev_url: https://github.com/bmad-sim/pytao

extra:
  recipe-maintainers:
    - hhslepicka
    - ChristopherMayes
    - ken-lauer
